; Copy values into the real multisaver.ini generated by /c.
; Save as UTF-16 LE with BOM if adding non-ASCII paths.
[Launcher]
DefaultSaver=C:\Windows\System32\Mystify.scr

; Replace the entire section name with a generated monitor identity.
[Monitor:REPLACE_WITH_GENERATED_DEVICE_INTERFACE_NAME]
Saver=savers\First.scr

[Monitor:REPLACE_WITH_ANOTHER_GENERATED_DEVICE_INTERFACE_NAME]
Saver=none
